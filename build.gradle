buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0,6.2)', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.client.mixins.json"
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    // 远程依赖仓库(用依赖坐标代替 libs/*.jar)
    maven {
        url "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        url "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    // 无公开 Maven 坐标的私有/GitHub-only 构件: 项目内本地 Maven 仓库
    maven {
        url = uri("repo")
        content { includeGroup "taczfixes.local" }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // 依赖全部使用 Maven 坐标; 无公开坐标的第三方/私有构件由项目内 repo/ 本地 Maven 仓库提供。
    // TaCZ 开发快照仍可用 -PtaczJar=libs/xxx.jar 临时覆盖。
    def taczJarOverride = providers.gradleProperty('taczJar').getOrNull()
    if (taczJarOverride) {
        implementation files(taczJarOverride)
    } else {
        implementation "taczfixes.local:tacz-forge:1.2.0"
    }

    compileOnly "taczfixes.local:create:6.0.8"
    compileOnly "taczfixes.local:apricityui:1.3.1"
    compileOnly "taczfixes.local:acceleratedrendering:1.0.14"
    compileOnly "taczfixes.local:projecte:PE1.0.1"
    compileOnly "taczfixes.local:embeddium:0.3.31"
    compileOnly "taczfixes.local:gunsmithlib:7.0.0-alpha.10"
    compileOnly "taczfixes.local:sbm:2.5.6"
    compileOnly "taczfixes.local:sbm-v2:2.6.2"
    compileOnly "taczfixes.local:mae:1.1.4"
    compileOnly "taczfixes.local:kuroutils:2001.2.5.0"
    compileOnly "taczfixes.local:mixinextras:0.3.6"
    compileOnly "taczfixes.local:luaj-core:3.0.8-figura"
    compileOnly "taczfixes.local:luaj-jse:3.0.8-figura"
    compileOnly "taczfixes.local:gd656peek:0.1.1"
    compileOnly "taczfixes.local:parcool:3.4.3.3"
    compileOnly "taczfixes.local:lrtactical:0.4.3"
    compileOnly "taczfixes.local:irons_spellbooks:3.16.3"
    compileOnly "taczfixes.local:cloth-config:11.1.136"
    compileOnly "taczfixes.local:commons-math3:3.6.1"
    compileOnly "taczfixes.local:taczexpands:1.4.0"
    compileOnly "taczfixes.local:touhoulittlemaid:1.5.0"
    compileOnly "taczfixes.local:ysm:2.6.5"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    annotationProcessor "taczfixes.local:mixinextras:0.3.6"
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json,${mod_id}.client.mixins.json"
        ])
    }


    exclude 'group/taczexpands/**'

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('printArcanaCp') {
    doLast {
        def hits = configurations.compileClasspath.files.findAll { it.name.toLowerCase().contains('arcana') }
        hits.each { println 'ARCPATH: ' + it.absolutePath }
        hits.each { 
            def z = new java.util.zip.ZipFile(it)
            def e = z.getEntry('group/taczexpands/dist/Cb5C6Ar3.class')
            println 'HAS Cb5C6Ar3: ' + (e != null)
            z.close()
        }
    }
}
