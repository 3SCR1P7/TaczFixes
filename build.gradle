plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run-server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    // 远程依赖仓库(用依赖坐标代替 libs/*.jar)
    maven {
        url "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        url "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    // 无公开 Maven 坐标的私有/GitHub-only 构件: 项目内本地 Maven 仓库
    maven {
        url = uri("repo")
        content { includeGroup "taczfixes.local" }
    }
}

dependencies {
    // 依赖全部使用 Maven 坐标; 无公开坐标的第三方/私有构件由项目内 repo/ 本地 Maven 仓库提供。
    compileOnly "taczfixes.local:tacz-neoforge:1.2.0"
    runtimeOnly "taczfixes.local:tacz-neoforge:1.2.0"

    compileOnly "taczfixes.local:apricityui:1.3.1"
    compileOnly "taczfixes.local:cloth-config:15.0.140"
    compileOnly "taczfixes.local:create:6.0.10"
    compileOnly "taczfixes.local:acceleratedrendering:1.0.14"
    compileOnly "taczfixes.local:gunsmithlib:6.4.5"
    compileOnly "taczfixes.local:lrtactical:0.4.3"
    compileOnly "taczfixes.local:projecte:PE1.1.0"
    compileOnly "taczfixes.local:irons_spellbooks:3.16.3"
    compileOnly "taczfixes.local:parcool:3.4.3.3"
    compileOnly "taczfixes.local:sodium:0.8.13"
    compileOnly "taczfixes.local:touhoulittlemaid:1.5.3"
    compileOnly "taczfixes.local:ysm:2.6.5"
    compileOnly "taczfixes.local:taczexpands:1.4.1"
    compileOnly "taczfixes.local:taczexpands-core:1.4.1"
    compileOnly "taczfixes.local:sbm:2.6.1"
    compileOnly "taczfixes.local:kuroutils:2101.2.5.1"
    compileOnly "taczfixes.local:mae:1.1.4"
    compileOnly "taczfixes.local:luaj-core:3.0.8-figura"
    compileOnly "taczfixes.local:luaj-jse:3.0.8-figura"

    implementation 'org.apache.commons:commons-math3:3.6.1'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    exclude 'group/taczexpands/**'

    // Jar-in-Jar: 把移植到 1.21.1 的 tacz_charms 打进本模组 jar, 由 NeoForge 在启动时加载。
    // 只有 libs 里存在该 jar 时才写入 metadata, 避免产出缺少内嵌 jar 的坏包。
    def bundledCharmsJar = file('libs/tacz_charms-1.21.1.jar')
    def jarJarMetadata = file('jarjar-metadata.json')
    if (bundledCharmsJar.exists() && jarJarMetadata.exists()) {
        into('META-INF/jarjar') {
            from(bundledCharmsJar)
            from(jarJarMetadata) {
                rename { 'metadata.json' }
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
